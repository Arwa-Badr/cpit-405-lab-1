<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lab 03</title>

    <link rel="stylesheet" href="style.css" />
    <style>
      .image-preview {
        width: 200px;
        padding: 20px;
        border-top: 20px solid skyblue;
        border-right: 20px solid pink;
        border-bottom: 20px solid lightgreen;
        border-left: 20px solid blanchedalmond;
        margin: 30px;
      }

      .image-preview img {
        width: 100%;
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="image-preview">
      <img src="https://cpit405.gitlab.io/images/KAU_logo.png" alt="KAU Logo" />
    </div>

    <div id="header">
      <span class="myclass1">Every</span>
      <span class="myclass2">one can</span>
      <span class="myclass3">success.</span>
    </div>

    <p>
      One machine can do the work of fifty ordinary men.
      <span class="myclass4">
        No machine can do the work of one extraordinary man.
      </span>
    </p>

    <table>
      <tr>
        <th></th>
        <th>color</th>
        <th>color when mouse over</th>
      </tr>

      <tr>
        <td>span.myclass1</td>
        <td>pink</td>
        <td>blue</td>
      </tr>

      <tr>
        <td>span.myclass2</td>
        <td>pink</td>
        <td>pink</td>
      </tr>

      <tr>
        <td>span.myclass3</td>
        <td>orange</td>
        <td>orange</td>
      </tr>

      <tr>
        <td>span.myclass4</td>
        <td>red</td>
        <td>red</td>
      </tr>
    </table>
  </body>
</html>
