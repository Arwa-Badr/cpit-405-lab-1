<!DOCTYPE html>
<html lang="en">

<head>
    <title>Event Tables</title>
</head>

<body>

    <table border="1">
        <caption>Event Schedule</caption>

        <tr>
            <th>Event</th>
            <th>Location</th>
            <th>Time</th>
        </tr>

        <tr>
            <td>Web Dev Intro</td>
            <td>Room A</td>
            <td>9:00 AM</td>
        </tr>

        <tr>
            <td>CSS Styling</td>
            <td>Room B</td>
            <td>11:00 AM</td>
        </tr>
    </table>


    <table border="1">

    <tr>
        <th colspan="2">Weekend Activities</th>
    </tr>

    <tr>
        <th>Saturday</th>
        <th>Sunday</th>
    </tr>

    <tr>
        <td>Hiking</td>
        <td>Swimming</td>
    </tr>

</table>


    <table border="1">

        <tr>
            <th rowspan="3">Monday</th>
            <td>9:00 AM - HTML Basics</td>
        </tr>

        <tr>
            <td>10:00 AM - CSS Intro</td>
        </tr>

        <tr>
            <td>11:00 AM - JavaScript Basics</td>
        </tr>

    </table>


    <table border="1">
        <caption>Event Schedule</caption>

        <tr>
            <th>Event</th>
            <th>Location</th>
        </tr>

        <tr>
            <td rowspan="2">Web Dev Intro</td>
            <td>Room A</td>
        </tr>

        <tr>
            <td>Room B</td>
        </tr>

    </table>

</body>

</html>
